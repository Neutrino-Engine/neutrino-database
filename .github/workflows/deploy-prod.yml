name: deploy-prod

# neutrino-database is baked into every Python service image at build time, so a
# merge here is a RELEASE TRAIN, not a single deploy:
#   1. build the migration image from this commit
#   2. run the migrations against the prod DB
#   3. fan out to every dependent service so they rebuild against THIS commit
# Skipping step 3 would leave services running old models against a new schema.
#
# Step 2 runs whatever neutrino-k8s/jobs/migrate-job.yaml sets. It must be
# `make migrate`; bare `alembic upgrade head` skips the backfill and the FGA model.

on:
  push:
    branches: [release-cmd]
  workflow_dispatch:

permissions:
  contents: read

env:
  ACR: crneutrinoprodcin001.azurecr.io
  IMAGE: neutrino-database-migrate
  AKS_RG: rg-neutrino-prod-cin-001
  AKS_NAME: aks-neutrino-prod-cin-001
  NAMESPACE: neutrino

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
      id-token: write      # Azure OIDC login + Sigstore keyless signing (this job only)
      attestations: write  # actions/attest-build-provenance
    outputs:
      db_sha: ${{ steps.ref.outputs.sha }}
    steps:
      # Always build prod from release-cmd: a repository_dispatch/schedule event
      # would otherwise check out the DEFAULT branch and ship dev code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          ref: release-cmd

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          repository: Neutrino-Engine/neutrino-k8s
          ssh-key: ${{ secrets.NEUTRINO_K8S_DEPLOY_KEY }}
          path: neutrino-k8s

      - id: ref
        run: echo "sha=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6  # v2.3.1
        with:
          client-id: 8894cdbc-d458-44ed-b8dc-1b42ee827bf8
          tenant-id: 713c9459-4056-4b3e-9162-591d6d67b03b
          subscription-id: 9501c581-8593-4b5d-ba3a-9f0aee32b481

      - name: ACR login
        run: az acr login --name crneutrinoprodcin001

      - name: Build and push migration image
        id: build
        run: |
          TAG="${{ steps.ref.outputs.sha }}"
          docker build -t "$ACR/$IMAGE:$TAG" -t "$ACR/$IMAGE:release-cmd" .
          docker push "$ACR/$IMAGE:$TAG"
          docker push "$ACR/$IMAGE:release-cmd"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$ACR/$IMAGE:$TAG")
          echo "api=${digest#*@}" >> "$GITHUB_OUTPUT"

      # Supply chain (G-27): SBOM + build provenance + keyless signature for every
      # pushed digest, verified before anything is deployed. Verification recipe
      # and the AKS admission plan: neutrino-database docs/RELEASING.md.
      - name: Install syft 1.52.0 + cosign 2.6.5 (pinned, sha256-verified)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/syft.tgz" \
            https://github.com/anchore/syft/releases/download/v1.52.0/syft_1.52.0_linux_amd64.tar.gz
          echo "caeedb81fb0491615f1ebd1761e4145d41ee86dd2cc7bf80669f9f5ad9d6133d  $RUNNER_TEMP/syft.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/syft.tgz" -C "$RUNNER_TEMP" syft
          curl -sSfL -o "$RUNNER_TEMP/cosign" \
            https://github.com/sigstore/cosign/releases/download/v2.6.5/cosign-linux-amd64
          echo "c3b4f5410e608af03a5eb0aaac84a4313d8da131248e08ff1759ac70c79d1644  $RUNNER_TEMP/cosign" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/cosign"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      # SLSA provenance, stored by GitHub and pushed to ACR beside the image.
      # Artifact attestations on a private repo need GitHub Enterprise Cloud; this
      # step does not block the deploy until a prod run shows it green.
      - name: Build provenance (api)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        continue-on-error: true
        with:
          subject-name: ${{ env.ACR }}/${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.api }}
          push-to-registry: true
          create-storage-record: false

      - name: SBOM attestation, signature, verification
        env:
          IMAGES: |
            ${{ env.ACR }}/${{ env.IMAGE }}@${{ steps.build.outputs.api }}
          # The certificate identity Sigstore issues to this exact workflow + ref.
          SIGNER: ${{ github.server_url }}/${{ github.workflow_ref }}
        run: |
          for ref in $IMAGES; do
            name=${ref##*/}; name=${name%@*}
            syft scan "registry:$ref" -o "spdx-json=$RUNNER_TEMP/$name.spdx.json"
            cosign sign --yes "$ref"
            cosign attest --yes --type spdxjson --predicate "$RUNNER_TEMP/$name.spdx.json" "$ref"
            cosign verify "$ref" --certificate-identity "$SIGNER" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
            cosign verify-attestation "$ref" --type spdxjson --certificate-identity "$SIGNER" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
            echo "signed, SBOM attested, verified: $ref"
          done

      - name: Run migrations (alembic + authz-store backfill + FGA model)
        run: |
          az aks get-credentials -g "$AKS_RG" -n "$AKS_NAME" --overwrite-existing
          kubectl delete job neutrino-db-migrate -n "$NAMESPACE" --ignore-not-found
          IMAGE_TAG="${{ steps.ref.outputs.sha }}@${{ steps.build.outputs.api }}" \
            envsubst < neutrino-k8s/jobs/migrate-job.yaml | kubectl apply -f -
          # Surface logs whether it passes or fails, then gate on the result.
          kubectl wait --for=condition=complete job/neutrino-db-migrate -n "$NAMESPACE" --timeout=600s &
          WAIT_OK=$!
          kubectl wait --for=condition=failed job/neutrino-db-migrate -n "$NAMESPACE" --timeout=600s && FAILED=1 &
          WAIT_FAIL=$!
          wait -n $WAIT_OK $WAIT_FAIL || true
          kubectl logs job/neutrino-db-migrate -n "$NAMESPACE" --tail=100 || true
          # Authoritative check: succeeded==1 or the step fails.
          test "$(kubectl get job neutrino-db-migrate -n "$NAMESPACE" -o jsonpath='{.status.succeeded}')" = "1"

  # Every dependent service rebuilds against this exact commit. Each dispatched
  # run stops at its own prod approval gate.
  rebuild-dependents:
    needs: migrate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        repo:
          - neutrino-gateway
          - connector-service
          - ES-Ingestion-Service
          - agent-platform
          - neutrino-workflow-service
    steps:
      # workflow_dispatch (not repository_dispatch): it takes an explicit `ref`,
      # so the service builds from release-cmd. repository_dispatch would run the
      # workflow from the DEFAULT branch (main), which has no deploy-prod.yml.
      - name: Dispatch rebuild to ${{ matrix.repo }}
        env:
          TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::GH_DISPATCH_TOKEN is not set — cannot trigger ${{ matrix.repo }}."
            echo "Run deploy-prod manually on ${{ matrix.repo }} (ref release-cmd," \
                 "neutrino_db_ref=${{ needs.migrate.outputs.db_sha }}) or add the token."
            exit 0
          fi
          curl -sf -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/Neutrino-Engine/${{ matrix.repo }}/actions/workflows/deploy-prod.yml/dispatches" \
            -d "{\"ref\":\"release-cmd\",\"inputs\":{\"neutrino_db_ref\":\"${{ needs.migrate.outputs.db_sha }}\"}}"
          echo "Dispatched ${{ matrix.repo }}@release-cmd to rebuild against neutrino-database@${{ needs.migrate.outputs.db_sha }}"

  summary:
    needs: [migrate, rebuild-dependents]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          {
            echo "### neutrino-database release train"
            echo ""
            echo "- migration image: \`${{ needs.migrate.outputs.db_sha }}\`"
            echo "- migrate job: ${{ needs.migrate.result }}"
            echo "- dependent rebuilds dispatched: ${{ needs.rebuild-dependents.result }}"
            echo ""
            echo "Each service run waits at its own **prod** approval gate."
          } >> "$GITHUB_STEP_SUMMARY"
